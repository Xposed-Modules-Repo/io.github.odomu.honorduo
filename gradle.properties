org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Let the daemon-toolchain criteria (gradle/gradle-daemon-jvm.properties) find the
# JDK each machine already has instead of downloading one: on this box JAVA_HOME is
# the JDK 21 this project is built with, and CI's setup-java points it at Temurin 21.
org.gradle.java.installations.fromEnv=JAVA_HOME

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# GitHub "owner/repo" the in-app updater reads releases from. Blank leaves the update
# card as a plain repository link instead of a check that can only ever fail.
repo=odomu/HonorDuo
